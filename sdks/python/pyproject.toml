[project]
name = "cerno"
version = "0.1.0"
description = "Python client for cerno — noul, choice and score against a locally hosted model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerno"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
