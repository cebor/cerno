# Keeps the workflow's actions on their newest major.
#
# The three package ecosystems are listed with no version-update PRs at all, so that Dependabot
# watches their lockfiles for advisories: a security update is raised regardless of the limit,
# once "Dependabot security updates" is on in the repository settings. Ordinary bumps stay a
# deliberate `cargo update` / `npm update` / `uv lock --upgrade` rather than a PR per dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: uv
    directory: /sdks/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
