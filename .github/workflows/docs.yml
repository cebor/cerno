# The website (site/) at the root of GitHub Pages and the rustdoc of every crate, cerno-bench
# included, under api/, with docs/rustdoc-index.html as that section's landing page.
# docs.rs builds the published crates on its own and is unaffected.
#
# Needs Settings → Pages → Source set to "GitHub Actions" once.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The website at the root, the rustdoc of every crate under api/. Stable rustdoc writes no
      # index of its own; the .lock is cargo's, not the site's.
      - run: |
          rm -f target/doc/.lock
          mkdir _site
          cp -r site/. _site/
          cp -r target/doc _site/api
          cp docs/rustdoc-index.html _site/api/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
