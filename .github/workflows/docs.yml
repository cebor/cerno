# The rustdoc of every crate, cerno-bench included, as one site on GitHub Pages, with
# docs/rustdoc-index.html as the landing page that also points at the Python and TypeScript SDKs.
# docs.rs builds the published crates on its own and is unaffected.
#
# Needs Settings → Pages → Source set to "GitHub Actions" once.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Stable rustdoc writes no index of its own. The .lock is cargo's, not the site's.
      - run: |
          cp docs/rustdoc-index.html target/doc/index.html
          rm -f target/doc/.lock
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
