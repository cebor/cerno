# Publishes a tag made by scripts/release.sh to crates.io, PyPI and npm, once the same suites
# as CI have passed on it.
#
# Every registry authenticates by trusted publishing, in the `release` environment, so no job
# needs a secret. crates.io and npm only accept a trusted publisher for a package that already
# exists, so a new crate or package goes out by hand once before this workflow can publish it.
#
# Every job skips what is already published, so a run that failed halfway can be re-run as it
# is.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A tag pushed by hand, not by the release script, would publish whatever version the
      # manifests happen to hold.
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [[ $GITHUB_REF_NAME == "v$version" ]] ||
            { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml is at $version"; exit 1; }

  crates:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # In dependency order; cerno-bench is publish = false and skipped. A crate whose version
      # is already out is excluded, because cargo refuses the whole run over one, so a job that
      # failed halfway (crates.io rate-limits new crates) could otherwise never be re-run.
      - run: |
          exclude=()
          while read -r name version; do
            if curl -sf "https://index.crates.io/${name:0:2}/${name:2:2}/$name" |
                jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              echo "::notice::$name@$version is already on crates.io"
              exclude+=(--exclude "$name")
            fi
          done < <(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          cargo publish --workspace --locked "${exclude[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  npm:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm 11, which does trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Skip a version already on npm
        id: published
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "cerno-sdk@$version" version | grep -q .; then
            echo "::notice::cerno-sdk@$version is already on npm"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.published.outputs.skip != 'true'
      # prepublishOnly builds both module formats.
      - run: npm publish --access public --provenance
        if: steps.published.outputs.skip != 'true'
