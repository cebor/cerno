[workspace]
resolver = "3"
members = [
    "crates/cerno-types",
    "crates/cerno-host",
    "crates/cerno-core",
    "crates/cerno-server",
    "crates/cerno-sdk",
    "crates/cerno-bench",
    "crates/cerno-tui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cebor/cerno"
readme = "README.md"

[workspace.dependencies]
# crates.io sees the versions, not the paths. Exact, because every crate is released at the one
# workspace version; scripts/release.sh bumps them together with it.
cerno-types = { path = "crates/cerno-types", version = "=0.1.1" }
cerno-host = { path = "crates/cerno-host", version = "=0.1.1" }
cerno-core = { path = "crates/cerno-core", version = "=0.1.1" }
cerno-sdk = { path = "crates/cerno-sdk", version = "=0.1.1" }

axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
# vendored: otherwise its build script downloads Swagger UI from GitHub, so `cargo install
# cerno-server` would need network access at build time and fetch an unpinned archive.
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
toml = "0.9"

mockito = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
