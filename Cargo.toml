[workspace]
resolver = "3"
members = [
    "crates/cerno-types",
    "crates/cerno-host",
    "crates/cerno-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/felixitzenplitz/cerno"

[workspace.dependencies]
cerno-types = { path = "crates/cerno-types" }
cerno-host = { path = "crates/cerno-host" }
cerno-core = { path = "crates/cerno-core" }
cerno-sdk = { path = "crates/cerno-sdk" }

axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
toml = "0.9"

mockito = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
